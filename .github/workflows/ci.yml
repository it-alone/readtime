# CI:类型检查 + 全量单测(含内容契约与 ≤500KB 分片预算卡口)+ 构建产物验证
# ARCHITECTURE.md §11 的"性能预算(CI 卡口)"由本工作流落实。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试(领域层 + 内容契约 + 分片预算)
        run: npm test

      - name: 构建(SPA 产物 + SW 清单注入)
        run: npm run build
